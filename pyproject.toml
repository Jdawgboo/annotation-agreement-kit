[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annotation-agreement-kit"
version = "0.1.0"
description = "Inter-annotator agreement and disagreement diagnostics"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
annotation-agreement = "annotation_agreement_kit:main"

[tool.setuptools]
py-modules = ["annotation_agreement_kit"]
package-dir = {"" = "src"}
